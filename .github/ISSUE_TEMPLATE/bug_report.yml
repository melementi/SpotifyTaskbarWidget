name: Bug report
description: The widget does not show up, crashes, or shows the wrong song or lyrics.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. A screenshot of the taskbar helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Widget version
      description: The release you downloaded, for example v1.2.0.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: From Settings > System > About, for example Windows 11 24H2.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Paste the contents of %LOCALAPPDATA%\SpotifyTaskbarWidget\error.log if the file exists.
      render: text
